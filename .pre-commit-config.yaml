# Install with:
#   uv run --directory backend --locked pre-commit install

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --directory backend --locked ruff check --fix
        language: system
        pass_filenames: false
        files: ^backend/(.*\.py|pyproject\.toml|uv\.lock)$

      - id: ruff-format
        name: Ruff format
        entry: uv run --directory backend --locked ruff format
        language: system
        pass_filenames: false
        files: ^backend/(.*\.py|pyproject\.toml|uv\.lock)$

      - id: ty
        name: ty typecheck
        entry: uv run --directory backend --locked ty check .
        language: system
        pass_filenames: false
        files: ^backend/(.*\.py|pyproject\.toml|uv\.lock)$
