name: API PR checks

on:
  pull_request:
    paths:
      - workers/api/**
      - .github/workflows/api-pr-checks.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vite.config.ts

permissions:
  contents: read

concurrency:
  group: api-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: API typecheck, lint, and tests
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ubc_discovery_test
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ubc_discovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ubc_discovery_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check migrations match the Drizzle schema
        run: |
          pnpm run db:check
          pnpm run db:generate --name uncommitted
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::src/db/schema.ts has changes without a committed migration. Run pnpm run db:generate."
            git status --short -- drizzle
            exit 1
          fi
      - name: Apply migrations to disposable test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm run db:migrate
      - run: pnpm run check
      - run: pnpm run test:runtime
