name: Extraction Worker PR checks

on:
  pull_request:
    paths:
      - workers/extraction/**
      - .github/workflows/extraction-pr-checks.yml

permissions:
  contents: read

concurrency:
  group: extraction-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Extraction typecheck, tests, and Worker build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workers/extraction
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workers/extraction/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
