name: Deploy Cloudflare production

# Cutover is coordinated manually. A merge never starts this deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build both Workers, deploy API, then web
    runs-on: ubuntu-24.04
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKEND_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKEND_AWS_SECRET_ACCESS_KEY }}
      EMAIL_SENDER_EMAIL: ${{ vars.EMAIL_SENDER_EMAIL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      UPLOAD_SIGNING_SECRET: ${{ secrets.UPLOAD_SIGNING_SECRET }}
      EXTRACTION_QUEUE_PRODUCER_SECRET: ${{ secrets.EXTRACTION_QUEUE_PRODUCER_SECRET }}
      VITE_API_URL: https://ubc-discovery-api.ubcdiscovery.workers.dev
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_ANALYTICS_DEBUG: "false"
      VITE_AUTH_TEST_MODE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workers/api/pnpm-lock.yaml
      - name: Require complete production configuration
        run: |
          node --test scripts/cloudflare-production-preflight.test.mjs
          export API_SECRETS_FILE="$RUNNER_TEMP/cloudflare-api-secrets.json"
          node scripts/cloudflare-production-preflight.mjs
      - name: Install API dependencies
        working-directory: workers/api
        run: pnpm install --frozen-lockfile
      - name: Check and package production API
        working-directory: workers/api
        run: |
          pnpm run typecheck
          pnpm exec wrangler deploy --env production --dry-run
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.13.1
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check and compile production web configuration
        working-directory: web
        run: |
          pnpm run typecheck
          pnpm run build
          node -e 'const c=JSON.parse(require("node:fs").readFileSync("build/server/wrangler.json", "utf8")); if(c.name!=="ubc-discovery-web" || c.account_id!==process.env.CLOUDFLARE_ACCOUNT_ID) throw new Error("Web build did not select production")'
          pnpm exec wrangler deploy --dry-run
      # Secrets and code are uploaded together, avoiding intermediate deployments.
      - name: Deploy production API
        working-directory: workers/api
        # Web uses pnpm 11; API dependencies were installed with pnpm 12 above.
        # Invoke its installed CLI directly instead of changing package managers again.
        run: ./node_modules/.bin/wrangler deploy --env production --secrets-file "$RUNNER_TEMP/cloudflare-api-secrets.json"
      - name: Check production API before deploying callers
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 3 --retry-all-errors --retry-max-time 60 \
            --output "$RUNNER_TEMP/cloudflare-api-health.json" \
            https://ubc-discovery-api.ubcdiscovery.workers.dev/
          node -e 'const v=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if(v.status!=="ok" || v.app!=="UBC Discovery API") process.exit(1)' "$RUNNER_TEMP/cloudflare-api-health.json"
          curl --fail --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 3 --retry-all-errors --retry-max-time 60 \
            --output "$RUNNER_TEMP/cloudflare-api-events.json" \
            'https://ubc-discovery-api.ubcdiscovery.workers.dev/events?limit=1'
          node -e 'const v=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if(!Array.isArray(v.events)) process.exit(1)' "$RUNNER_TEMP/cloudflare-api-events.json"
      - name: Deploy compiled production web
        working-directory: web
        run: pnpm exec wrangler deploy
      - name: Check shadow web origin
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 3 --retry-all-errors --retry-max-time 60 --output /dev/null https://ubc-discovery-web.ubcdiscovery.workers.dev/
      - name: Check production custom domain
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 3 --retry-all-errors --retry-max-time 60 \
            --output /dev/null https://ubcdiscovery.com/
      - name: Remove private deployment file
        if: always()
        run: rm -f "$RUNNER_TEMP/cloudflare-api-secrets.json" "$RUNNER_TEMP/cloudflare-api-health.json" "$RUNNER_TEMP/cloudflare-api-events.json"
