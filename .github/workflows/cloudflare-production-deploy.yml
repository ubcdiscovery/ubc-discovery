name: Deploy Cloudflare production

# Cutover is coordinated manually. A merge never starts this deployment.
# Each run deploys the Workers whose code changed since the last successful run,
# always in the same order: the extraction Worker (Queue consumer) before the web
# Worker and its API (Queue producer). Every check runs before anything deploys.
on:
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Deploy both Workers even if their code is unchanged
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # find the last successful run

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the production Workers
    runs-on: ubuntu-24.04
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKEND_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKEND_AWS_SECRET_ACCESS_KEY }}
      EMAIL_SENDER_EMAIL: ${{ vars.EMAIL_SENDER_EMAIL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      UPLOAD_SIGNING_SECRET: ${{ secrets.UPLOAD_SIGNING_SECRET }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_ANALYTICS_DEBUG: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select Workers changed since the last successful deploy
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ALL: ${{ inputs.deploy_all }}
        run: |
          select_workers() {
            echo "extraction=$1" >> "$GITHUB_OUTPUT"
            echo "web=$2" >> "$GITHUB_OUTPUT"
            echo "Extraction Worker: $1 · Web Worker and API: $2 ($3)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ "$DEPLOY_ALL" = "true" ]; then
            select_workers true true "requested"
          fi
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cloudflare-production-deploy.yml \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            select_workers true true "no earlier successful deploy to compare with"
          fi
          changed=$(git diff --name-only "$base" HEAD)
          # Dependencies and this workflow affect both Workers. The API is bundled into the web Worker.
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/cloudflare-production-deploy\.yml)$'
          extraction=false
          web=false
          if grep -Eq "$shared|^workers/extraction/" <<< "$changed"; then extraction=true; fi
          if grep -Eq "$shared|^(web|workers/api)/|^scripts/cloudflare-production-" <<< "$changed"; then web=true; fi
          select_workers "$extraction" "$web" "changes since ${base:0:7}"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.extraction == 'true' || steps.changes.outputs.web == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.extraction == 'true' || steps.changes.outputs.web == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Require complete production configuration
        if: steps.changes.outputs.web == 'true'
        run: |
          node --test scripts/cloudflare-production-preflight.test.mjs
          export WORKER_SECRETS_FILE="$RUNNER_TEMP/cloudflare-worker-secrets.json"
          node scripts/cloudflare-production-preflight.mjs
      - name: Install dependencies
        if: steps.changes.outputs.extraction == 'true' || steps.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile

      # Checks for every selected Worker run before either one deploys.
      - name: Check and package the extraction Worker
        if: steps.changes.outputs.extraction == 'true'
        working-directory: workers/extraction
        run: |
          pnpm run check
          pnpm exec wrangler deploy --env production --dry-run
      - name: Check API
        if: steps.changes.outputs.web == 'true'
        working-directory: workers/api
        run: pnpm run typecheck
      - name: Check and compile production web configuration
        if: steps.changes.outputs.web == 'true'
        working-directory: web
        run: |
          pnpm run typecheck
          pnpm run build
          node -e 'if (JSON.parse(require("node:fs").readFileSync("build/server/wrangler.json", "utf8")).name !== "ubc-discovery-web") throw new Error("Web build did not select production")'
          pnpm exec wrangler deploy --dry-run

      - name: Deploy production extraction Worker
        if: steps.changes.outputs.extraction == 'true'
        working-directory: workers/extraction
        run: pnpm exec wrangler deploy --env production
      - name: Check production extraction Worker
        if: steps.changes.outputs.extraction == 'true'
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 3 --retry-all-errors --retry-max-time 60 \
            https://ubc-discovery-extraction.ubcdiscovery.workers.dev/health \
            | jq -e '.status == "ok"'
      - name: Apply database migrations
        if: steps.changes.outputs.web == 'true'
        working-directory: workers/api
        run: pnpm run db:migrate
      - name: Deploy production web and API
        if: steps.changes.outputs.web == 'true'
        working-directory: web
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/cloudflare-worker-secrets.json"
      - name: Check production
        if: steps.changes.outputs.web == 'true'
        shell: bash
        run: |
          get() {
            curl --fail --silent --show-error --max-time 30 \
              --retry 5 --retry-delay 3 --retry-all-errors --retry-max-time 60 "$1"
          }
          get https://ubcdiscovery.com/api/ \
            | jq -e '.status == "ok" and .app == "UBC Discovery API"'
          get 'https://ubcdiscovery.com/api/events?limit=1' \
            | jq -e '.events | type == "array"'
          get https://ubcdiscovery.com/ > /dev/null
      - name: Remove private deployment file
        if: always()
        run: rm -f "$RUNNER_TEMP/cloudflare-worker-secrets.json"
