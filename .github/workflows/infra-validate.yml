name: Validate infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-validate.yml"
      - "backend/app/config.py"
      - "backend/app/database.py"
      - "backend/tests/test_config.py"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-validate.yml"
      - "backend/app/config.py"
      - "backend/app/database.py"
      - "backend/tests/test_config.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v7.3.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install lightweight validators
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck

      - name: Validate beta operating package
        run: infra/scripts/validate.sh

      - name: Test beta database SSL configuration
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
        run: uv run --frozen pytest tests/test_config.py -v
