name: Web PR checks

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-pr-checks.yml'

permissions:
  contents: read

concurrency:
  group: web-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, build, and end-to-end tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run desktop and mobile end-to-end tests
        run: pnpm run test:e2e --project=desktop --project=mobile

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-failures
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
