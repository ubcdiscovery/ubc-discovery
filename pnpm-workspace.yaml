packages:
  - web
  - workers/*

# Tool versions shared by every package. Reference them as "catalog:".
catalog:
  "@cloudflare/workers-types": 5.20261012.1
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
  vitest: 5.0.3
  wrangler: 4.149.0

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261012.1"

allowBuilds:
  "@firebase/util": true
  esbuild: true
  protobufjs: true
  workerd: true
