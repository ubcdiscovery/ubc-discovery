services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: ubc_discovery
      POSTGRES_USER: ubc_discovery
      POSTGRES_PASSWORD: ubc_discovery
    ports:
      - "5433:5432"
    volumes:
      - ubc_discovery_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubc_discovery -d ubc_discovery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ubc_discovery_postgres_data:
